# Independent, disposable stack: no host ports and no production volumes.
services:
  db:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ci_only_password
    command: ["postgres", "-c", "max_connections=80", "-c", "jit=off"]
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: .
    environment: &database
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: portfolio
      PGUSER: portfolio
      PGPASSWORD: ci_only_password
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20
  runner:
    build: .
    profiles: ["tools"]
    environment: *database

name: postgres-order-lab
services:
  db:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: local_lab_only
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=80", "-c", "jit=off"]
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 3s
      timeout: 3s
      retries: 30
    shm_size: 256mb
  api:
    build: .
    environment: &environment
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: portfolio
      PGUSER: portfolio
      PGPASSWORD: local_lab_only
      RESULTS_DIR: /app/results
      EXECUTION_ENVIRONMENT: docker-compose
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./results:/app/results:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
  runner:
    build: .
    profiles: ["tools"]
    environment: *environment
    volumes:
      - ./results:/app/results
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "src/benchmark.mjs"]
volumes:
  pgdata:
